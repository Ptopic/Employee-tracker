services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    # Allows using host.docker.internal in DATABASE_URL on Linux hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3002"
    ports:
      - "${BACKEND_PORT}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
